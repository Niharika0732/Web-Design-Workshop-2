<!DOCTYPE html>
<html>
    <head>
        <title>Prime Number Chcecker</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">
            
            <h2>Prime Number Checker</h2>
            <label>Enter a number:</label>
            <input type="number" id="num">
            <button onclick="checkPrime()">Check</button>

            <h3 id="result"></h3>
        </div>
    </body>
    <script>
        function checkPrime() {
            let n = document.getElementById("num").value;
            n = parseInt(n);

            let isPrime = true;

            if (n <= 1) {
                isPrime = false;
            } else {
                for (let i = 2; i <= Math.sqrt(n); i++) {
                    if (n % i == 0) {
                        isPrime = false;
                        break;
                    }
                }
            }

            if (isPrime) {
                document.getElementById("result").innerText = n + " is a Prime Number";
            } else {
                document.getElementById("result").innerText = n + " is NOT a Prime Number";
            }
        }
    </script>
</html>
